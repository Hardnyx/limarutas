name: Actualizar red proyectada ATU
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-atu-pmu.yml
      - config/atu_geovisor_layers.json
      - pipeline/scripts/atu/**
  workflow_dispatch:
    inputs:
      audit:
        description: Descargar sin caché condicional
        type: boolean
        default: false
  schedule:
    - cron: '17 11 * * 1'
permissions:
  contents: write
  actions: write
concurrency:
  group: atu-pmu-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: pipeline/temp/atu-sources
          key: atu-pmu-v1-${{ github.run_id }}
          restore-keys: atu-pmu-v1-
      - name: Descargar, comparar y validar antes de promover
        env:
          AUDIT: ${{ inputs.audit }}
        run: |
          if [ "$AUDIT" = "true" ]; then
            python3 pipeline/scripts/atu/sync_geovisor.py --force
          else
            python3 pipeline/scripts/atu/sync_geovisor.py
          fi
      - name: Validar derivados y contratos
        run: |
          python3 pipeline/scripts/atu/validate_pmu.py
          python3 -m unittest discover -s pipeline/tests
          python3 pipeline/run.py validate
      - name: Publicar solo cambios de contenido
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/raw/atu_geovisor data/processed/planificado docs/atu/pmu_inventory.json pipeline/output/atu_pmu_diff.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(data): refresh ATU PMU projected network"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atu-pmu-sync-report
          path: pipeline/temp/atu-sync-report.json
