name: Pruebas (dominio, datos y Playwright)

# En main las corre el workflow de Pages antes de publicar (workflow_call)
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Validar fotos de rutas (autor y licencia libre)
        run: python3 pipeline/scripts/photos/commons_photos.py --check

      - name: Validar contratos de datos
        run: |
          python3 -m unittest discover -s pipeline/tests
          python3 pipeline/run.py validate --manifest pipeline-inventory.json

      - name: Correr pruebas
        run: npm test
        env:
          CI: true

      - name: Guardar reporte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Guardar inventario de datos validados
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-inventory
          path: pipeline-inventory.json
          retention-days: 7
